name: CI

on:
  push:
    branches: ["**"]
    paths:
      - "backend/**"
      - "platform/**"
      - "src/**"
      - "*.ts"
      - "*.json"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/**"
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      # The server embeds internal/server/dist at compile time; the real UI is built in the docker job.
      - name: Stub the embedded UI
        run: mkdir -p internal/server/dist && touch internal/server/dist/.gitkeep

      - name: Verify go.mod/go.sum are tidy
        run: go mod tidy -diff

      - name: Check formatting
        run: |
          UNFORMATTED="$(gofmt -l .)"
          if [ -n "$UNFORMATTED" ]; then
            echo "These files need gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Install platform UI dependencies
        run: npm ci
        working-directory: platform/ui

      - name: Typecheck platform UI
        run: npm run typecheck
        working-directory: platform/ui

      - name: Build platform UI
        run: npm run build
        working-directory: platform/ui

  docker:
    needs: [backend, frontend]
    name: docker (${{ matrix.image }}, ${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: bench,    dockerfile: Dockerfile,          platform: linux/amd64, runner: ubuntu-latest }
          - { image: bench,    dockerfile: Dockerfile,          platform: linux/arm64, runner: ubuntu-24.04-arm }
          - { image: platform, dockerfile: platform/Dockerfile, platform: linux/amd64, runner: ubuntu-latest }
          - { image: platform, dockerfile: platform/Dockerfile, platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }},mode=max
